<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento-Grid</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="box box-1">
        Social Media <span class="highlight1">10x</span> Faster with AI
        <div class="rating-container">
          <img
            class="stars"
            src="/bento-grid-main/assets/images/illustration-five-stars.webp"
            alt=""
          />
        </div>
        <span class="review">Over 4,000 5-star reviews</span>
      </div>
      <div class="box box-2">
        <div class="image-container">
          <img
            src="/bento-grid-main/assets/images/illustration-multiple-platforms.webp"
            alt=""
          />
        </div>
        Manage multiple accounts and platform.
      </div>
      <div class="box box-3">
        <div class="calendar">
          Maintain a consistent posting schedule.
          <img
            src="/bento-grid-main/assets/images/illustration-consistent-schedule.webp"
            alt=""
          />
        </div>
      </div>
      <div class="box box-4">
        <div class="schedule">
          <span>Schedule to social media.</span>
          <img
            src="/bento-grid-main/assets/images/illustration-schedule-posts.webp"
            alt=""
          />
          <div class="footer">
            Optimize post timings to publish content at the perfect time for
            your audience
          </div>
        </div>
      </div>
      <div class="box box-5">5</div>
      <div class="box box-6">6</div>
      <div class="box box-7">7</div>
      <div class="box box-8">8</div>
    </div>
  </body>
</html>
